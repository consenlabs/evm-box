name: Prepare

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: setup yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: install
        run: yarn install --check-files --frozen-lockfile
      - name: lint
        run: yarn eslint common/utils.ts common/utils.spec.ts pages/index.tsx
      - name: test
        run: yarn test
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: setup yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: install
        run: yarn install --check-files --frozen-lockfile
      - name: build
        run: yarn build

